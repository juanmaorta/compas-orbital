<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compás en órbita · soleá por bulerías para cajón</title>
<meta name="description" content="Los doce tiempos de la soleá por bulerías en círculo, con una órbita por cada voz del cajón — grave, agudo y relleno — en tiempos y medios tiempos, y el clic del metrónomo.">
<meta property="og:title" content="Compás en órbita">
<meta property="og:description" content="El compás de doce de la soleá por bulerías, en círculo y por voces del cajón.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230B1017'/><circle cx='16' cy='16' r='10.5' fill='none' stroke='%236E8296' stroke-width='1.2'/><circle cx='16' cy='16' r='6.5' fill='none' stroke='%23E3A53C' stroke-width='1.2'/><circle cx='16' cy='6' r='2.4' fill='%23E0574A'/></svg>">
<meta name="theme-color" content="#E9EBF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1017" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compás">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Cajón flamenco · <span id="paloName">soleá por bulerías</span></div>
    <h1>Compás en <em>órbita</em></h1>
  </header>

  <div class="stage">
    <div class="dial-col">
      <div class="dial">
        <svg id="dial" viewBox="0 0 520 520" role="img"
             aria-label="Dial circular del compás de soleá por bulerías con tres órbitas de cajón y una de metrónomo">
          <g id="static"></g>
          <g id="dots"></g>
          <g class="needle" id="needle">
            <line x1="260" y1="260" x2="260" y2="32"></line>
            <circle cx="260" cy="32" r="3.5"></circle>
          </g>
          <g id="hits"></g>
        </svg>
        <button class="hub" id="hub" aria-label="Reproducir el compás">
          <span class="glyph" id="hubGlyph">▶</span>
          <span class="bpm"><span id="hubBpm">150</span> ppm</span>
        </button>
      </div>

      <div class="count" id="count"></div>
    </div>

    <div class="panel">
      <div class="card">
        <h2>Compás</h2>
        <div class="row" style="margin-bottom:12px">
          <label for="palo">Palo</label>
          <select id="palo"></select>
        </div>
        <div class="row" id="patternRow" style="margin-bottom:12px">
          <label for="pattern">Patrón de compás</label>
          <select id="pattern"></select>
        </div>
        <div class="row" style="margin-bottom:8px">
          <label for="tempo">Tempo</label>
          <input type="range" id="tempo" min="80" max="260" step="2" value="150">
          <span class="num" id="tempoVal">150</span>
        </div>
        <p class="metro-note" id="metroNote"></p>
        <p class="hint" id="paloHint" hidden></p>
        <p class="hint" id="iosHint" hidden></p>
      </div>

      <details class="more" id="more" open>
        <summary>Órbitas, volúmenes y biblioteca</summary>
        <div class="more-body">
        <div class="card">
          <h2>Órbitas</h2>
          <div id="voices"></div>
        </div>

        <div class="card">
          <h2>Biblioteca</h2>
          <div class="lib-form">
            <input type="text" id="libName" placeholder="bulería remate 1" maxlength="60"
                   autocomplete="off" aria-label="Nombre del patrón">
            <button id="libSave">Guardar</button>
          </div>
          <ul class="lib-list" id="libList"></ul>
          <div class="seg" style="margin-top:12px">
            <button id="share">Copiar enlace</button>
            <button id="reset">Patrón base</button>
            <button id="clear">Vaciar</button>
          </div>
          <p class="hint" id="libHint">Se guardan en este navegador. <em>Copiar enlace</em> lleva el compás dentro.</p>
        </div>
        </div>
      </details>
    </div>
  </div>

</div>
<script type="module" src="assets/app.js"></script>
<script>
  /* Instalable y con arranque sin conexión. Va fuera del módulo a propósito:
     si el grafo de módulos fallara, el registro no debe caer con él. */
  /* En móvil, los ajustes empiezan plegados: lo que se usa tocando es el
     dial, el conteo y el tempo. Van abiertos en el HTML para que sin JS se
     vea todo. */
  const more = document.getElementById("more");
  if (more && window.matchMedia("(max-width: 719px)").matches) more.open = false;

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
